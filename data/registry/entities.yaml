# Baseera Official Entity Registry (source of truth)
# ---------------------------------------------------------------------------
# Rules (see CLAUDE.md):
#  * Every entity has source_url + verified_on.
#  * status: verified       -> domain AND listed phones were read on the entity's own official
#                              website on verified_on (source_url = the page they were read from).
#            domain_only    -> official domain is the entity's live website (fetched on verified_on),
#                              but NO phone number was confirmed. official_phones stays empty.
#                              Product owner must add phones from the official contact page.
#  * Never add a phone you did not read on the official site yourself.
#  * official_domains are registrable domains; any sub-domain of them is treated as official.
# Verified by the Baseera build on 2026-11-19 (Asia/Muscat) by fetching the pages below.

